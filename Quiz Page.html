<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Page</title>
    <link rel="stylesheet" href="Style sheet for quiz.css">
    
</head>

<body>
    <!-- Hidden form to submit selections to Flask -->
    <form id="quizForm" action="/result" method="POST" style="display:none;">
        <input type="hidden" name="q1" id="q1" />
        <input type="hidden" name="q2" id="q2" />
        <input type="hidden" name="q3" id="q3" />
        <input type="hidden" name="q4" id="q4" />
    </form>

    <div class="quizcontainer" data-question="q1">
        <h1>HOW DO YOU NORMALLY FEEL WHEN YOU WAKE UP?</h1>

        <div class="row">
            <button type="button" class="answer" data-option="A">A. Ready to take on the world</button>
            <button type="button" class="answer" data-option="B">B. Still half asleep</button>
        </div>

        <div class="row">
            <button type="button" class="answer" data-option="C">C. Cheerful and excited for breakfast</button>
            <button type="button" class="answer" data-option="D">D. Calm and refreshed</button>
        </div>
    </div>

    <div class="quizcontainer" data-question="q2">
        <h1>WHAT IS YOUR FAVOURITE SEASON?</h1>

        <div class="row">
            <button type="button" class="answer" data-option="A">A. Summer</button>
            <button type="button" class="answer" data-option="B">B. Autumn</button>
        </div>

        <div class="row">
            <button type="button" class="answer" data-option="C">C. Winter</button>
            <button type="button" class="answer" data-option="D">D. Spring</button>
        </div>
    </div>

    <div class="quizcontainer" data-question="q3">
        <h1>HOW OFTEN DO YOU EXERCISE?</h1>

        <div class="row">
            <button type="button" class="answer" data-option="A">A. Everyday</button>
            <button type="button" class="answer" data-option="B">B. Three times a week</button>
        </div>

        <div class="row">
            <button type="button" class="answer" data-option="C">C. Once a week</button>
            <button type="button" class="answer" data-option="D">D. None at all</button>
        </div>
    </div>

    <div class="quizcontainer" data-question="q4">
        <h1>WHATS YOUR FAVOURITE TYPE OF HOLIDAY?</h1>

        <div class="row">
            <button type="button" class="answer" data-option="A">A. Tropical</button>
            <button type="button" class="answer" data-option="B">B. Adventure</button>
        </div>

        <div class="row">
            <button type="button" class="answer" data-option="C">C. City</button>
            <button type="button" class="answer" data-option="D">D. Luxury</button>
        </div>
    </div>

    <div class="result-button-container">
        <button type="button" id="submitQuiz" class="resultBtn">Find Your Breakfast!</button>
    </div>
      
    

    <script>
        
        const selections = {}; // { q1: 'A', q2: 'B', ... }
        const buttons = document.querySelectorAll('.answer');
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const container = button.closest('.quizcontainer');
                const qName = container.getAttribute('data-question');
                // Unselect others in this question
                container.querySelectorAll('.answer').forEach(btn => btn.classList.remove('selected'));
                // Select this one
                button.classList.add('selected');
                // Store selection
                selections[qName] = button.getAttribute('data-option');
            });
        });

        const resultBtn = document.querySelector('.resultBtn');

resultBtn.addEventListener('click', (e) => {
    const quizContainers = document.querySelectorAll('.quizcontainer');
    let allAnswered = true;

    quizContainers.forEach(container => {
        const selected = container.querySelector('.answer.selected');
        if (!selected) allAnswered = false;
    });

    if (!allAnswered) {
        e.preventDefault(); // stops navigation
        alert('Please answer all questions before continuing!');
    }
    // if allAnswered is true, the link will work normally
});

    </script>
    
</body>
</html>
