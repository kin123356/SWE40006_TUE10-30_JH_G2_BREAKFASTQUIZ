name: Build Website (HTML + Flask)

on:
  push:
    branches:
      - '**'   # run on any branch
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # lets you run manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Node setup (optional, for JS tools) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then npm install; else echo "No package.json found"; fi

      - name: Run Node tests (optional)
        run: |
          if [ -f package.json ]; then npm test || echo "No Node tests found"; else echo "No Node tests"; fi

      # --- Python setup (for Flask) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt found"; fi

      - name: Check Flask app (optional)
        run: |
          if [ -f app.py ]; then
            echo "Found Flask app. Testing run..."
            FLASK_APP=app.py flask --version
          else
            echo "No Flask app found — skipping Flask run."
          fi

      # --- Static site check (HTML/CSS) ---
      - name: Verify HTML/CSS presence
        run: |
          echo "Checking for HTML and CSS files..."
          ls -al *.html || echo "No HTML files found"
          ls -al *.css || echo "No CSS files found"

      - name: Build project complete
        run: echo "✅ Build completed successfully!"
